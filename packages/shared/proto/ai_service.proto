syntax = "proto3";

package aiservice;

option go_package = "github.com/inkbloom/server/proto/aiservice";

service AIService {
  rpc ChatStream(ChatRequest) returns (stream ChatChunk);
  rpc ChatComplete(ChatRequest) returns (ChatResponse);
  rpc GenerateImagePrompt(ImagePromptRequest) returns (ImagePromptResponse);
  rpc ExtractEntities(ExtractRequest) returns (EntityResponse);
  rpc ExtractRelations(RelationRequest) returns (RelationResponse);
  rpc CheckConsistency(ConsistencyRequest) returns (ConsistencyResponse);
}

message ChatRequest {
  repeated Message messages = 1;
  string model = 2;
  float temperature = 3;
  int32 max_tokens = 4;
  map<string, string> context = 5;
}

message Message {
  string role = 1;
  string content = 2;
}

message ChatChunk {
  string content = 1;
  string finish_reason = 2;
  Usage usage = 3;
}

message ChatResponse {
  string content = 1;
  Usage usage = 2;
}

message Usage {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  int32 total_tokens = 3;
}

message ImagePromptRequest {
  string context_text = 1;
  string novel_genre = 2;
  string style = 3;
}

message ImagePromptResponse {
  string prompt = 1;
  string negative_prompt = 2;
}

message ExtractRequest {
  string text = 1;
  int64 novel_id = 2;
  int64 chapter_id = 3;
}

message EntityResponse {
  repeated Entity entities = 1;
}

message Entity {
  string name = 1;
  string type = 2;
  string description = 3;
  map<string, string> properties = 4;
}

message RelationRequest {
  string text = 1;
  int64 novel_id = 2;
  repeated Entity entities = 3;
}

message RelationResponse {
  repeated Relation relations = 1;
}

message Relation {
  string source_name = 1;
  string target_name = 2;
  string relation_type = 3;
  string description = 4;
}

message ConsistencyRequest {
  string text = 1;
  int64 novel_id = 2;
  repeated Entity entities = 3;
}

message ConsistencyResponse {
  repeated ConsistencyIssue issues = 1;
}

message ConsistencyIssue {
  string description = 1;
  string severity = 2;
  string entity_name = 3;
}
